name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: git diff --exit-code -- dist/humidifier-card.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
